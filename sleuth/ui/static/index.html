<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sleuth</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">Sleuth <span class="muted">brain viewer</span></div>
    <div class="filters" role="toolbar" aria-label="Filters">
      <label>Run <select id="run-select"></select></label>
      <label>Suite <select id="suite-select"></select></label>
      <label>Checkpoint <select id="ckpt-select"></select></label>
      <button id="refresh" type="button" title="Reload data">Refresh</button>
      <button id="theme" type="button" title="Toggle light/dark">Theme</button>
    </div>
  </header>

  <main>
    <p id="status" class="status" role="status"></p>

    <section class="tiles" id="tiles" aria-label="Run summary"></section>

    <section class="card" id="training-card">
      <div class="card-head">
        <h2>Training</h2>
        <p class="hint">Loss in nats per token. Validation is measured on held-out text; a gap that grows means overfitting.</p>
      </div>
      <div class="chart" id="loss-chart"></div>
    </section>

    <nav class="tabs" role="tablist" aria-label="Analyzer views" id="tabs"></nav>

    <section class="card" id="timeline-card">
      <div class="card-head">
        <h2 id="timeline-title">Across checkpoints</h2>
        <div class="controls">
          <label>Metric <select id="metric-select"></select></label>
          <label><input type="checkbox" id="logx" checked> log-scale steps</label>
        </div>
      </div>
      <p class="hint" id="metric-help"></p>
      <div class="two-col">
        <div><h3 id="lines-title">One line per layer</h3><div class="chart" id="timeline-chart"></div></div>
        <div><h3>Row × checkpoint</h3><div class="chart" id="timeline-heat"></div></div>
      </div>
    </section>

    <section class="card" id="detail"></section>
  </main>
  <div id="tooltip" class="tooltip" hidden></div>
</body>
</html>
