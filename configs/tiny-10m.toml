# Milestone 1 target: ~9.4M non-embedding parameters (+3.1M embedding at
# vocab 8192). Meant for a GPU: on an RTX 5060 Ti or a GB10 expect minutes,
# not hours. On the synthetic corpus it will get very good at its little
# world; on TinyStories it should write coherent short stories.
#
#   python -m sleuth train configs/tiny-10m.toml
#   python -m sleuth train configs/tiny-10m.toml --set data.shards=data/shards/tinystories
name = "tiny-10m"

[data]
shards = "data/shards/synthetic"

[model]
vocab_size = 0
d_model = 384
n_layers = 6
n_heads = 6             # head_dim 64
n_kv_heads = 2          # GQA: 3 query heads share each K/V head
max_seq_len = 512
qk_norm = false
tie_embeddings = true

[train]
device = "auto"
precision = "bf16"
micro_batch_size = 64
grad_accum = 1
seq_len = 512
max_steps = 5000        # 5000 x 64 x 512 = 164M tokens ≈ 17 tokens/param (non-embedding)
lr = 1e-3
min_lr_ratio = 0.1
warmup_steps = 200
schedule = "cosine"
weight_decay = 0.1
grad_clip = 1.0
log_every = 20
eval_every = 250
eval_batches = 40
snapshot_every = 500    # plus log-spaced early snapshots (1, 2, 4, ... steps)
resume_every = 500
compile = false         # try true on the GPU boxes once the basics work: often 1.3-2x faster
peak_tflops = 0.0       # fill in from hardware/<host>.json (bf16 TFLOP/s) to log MFU
