# Experiment 2: more capacity without more compute (n-gram memory), and more
# compute without more weights (looped layers). Same shape, budget and data as
# ideas-1, so its baseline (val bpb 1.2334) is the reference; it's rerun here so
# the table stands on its own.
#
#   loop8     8 layers' worth of compute from 6 layers' weights: layers 2-3 run twice
#   deep8     8 separate layers (more weights too): what looping is trying to match
#   share4    6 layers' compute from 4 layers' weights (1 and 3 are reused once)
#   mem       + n-gram memory: 2 orders x 2 hashes x 262k rows x 32 = 33.6M lookup
#             parameters (1.5x the model) before layer 1; almost no extra FLOPs
#   mem-big   the same with 1M rows per table: 134M lookup parameters (6x the model)
#
#   python -m sleuth experiment configs/experiments/ideas-2.toml
name = "ideas-2"
base = "configs/mix-20m.toml"
set = [
    "data.shards=data/shards/mix-3b",
    "train.max_steps=2500",
    "train.warmup_steps=200",
    "train.doc_mask=true",
    "train.doc_mask_kernel='flex'",
    "train.eval_every=500",
    "train.snapshot_every=2500",
    "train.snapshot_log_spaced=false",
]

[[variant]]
name = "baseline"

[[variant]]
name = "loop8"
set = ["model.n_layers=8", "model.shared_layers=[0, 1, 2, 3, 2, 3, 6, 7]"]

[[variant]]
name = "deep8"
set = ["model.n_layers=8"]

[[variant]]
name = "share4"
set = ["model.shared_layers=[0, 1, 1, 3, 3, 5]"]

[[variant]]
name = "mem"
set = ["model.mem_rows=262144", "model.mem_layers=[1]"]

[[variant]]
name = "mem-big"
set = ["model.mem_rows=1048576", "model.mem_layers=[1]"]

# mem-big ran out of GPU memory headroom (12.5 GB peak on the 16 GB card) and trained 6x slower;
# half-size micro-batches (same tokens per step) peak at 4.9 GB and train at full speed.
[[variant]]
name = "mem-big-mb8"
set = ["model.mem_rows=1048576", "model.mem_layers=[1]", "train.micro_batch_size=8", "train.grad_accum=8"]
