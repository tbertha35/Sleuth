# Scaling ladder, rung 2: d=640, 10 layers: ~64M parameters (43M non-embedding).
# Same data, tokenizer and context as mix-20m / mix-100m.
#
# 7600 steps x 16 x 1024 x 8 = 1.0B tokens (~16 per parameter). Estimated ~9 h on the
# RTX 5060 Ti: an overnight run. Ctrl-C saves a checkpoint; continue with
# `python -m sleuth train --resume runs/<run-id>`.
#
#   python -m sleuth train configs/mix-60m.toml
name = "mix-60m"

[data]
shards = "data/shards/mix"

[model]
vocab_size = 0          # from the shards (tokenizer trained with --vocab-size 32768)
d_model = 640
n_layers = 10
n_heads = 10
n_kv_heads = 2
max_seq_len = 1024

[train]
micro_batch_size = 16
grad_accum = 8
max_steps = 7600
lr = 6e-4
warmup_steps = 400
device = "auto"
precision = "bf16"
seq_len = 1024
min_lr_ratio = 0.1
schedule = "cosine"
weight_decay = 0.1
grad_clip = 1.0
log_every = 25
eval_every = 250
eval_batches = 40
snapshot_every = 500
resume_every = 500
peak_tflops = 44.75     # RTX 5060 Ti measured bf16 matmul peak; enables the MFU column. Change per machine.
